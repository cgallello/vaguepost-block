<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>VagueBlock evaluation runner</title><link rel="stylesheet" href="../ui.css"></head>
<body class="vgb-ui"><main style="max-width:760px;margin:auto">
  <header><img src="../assets/king-point.png" alt="" class="vgb-mini-king"><div><p class="eyebrow">THE VAGUEPOST KING'S TRIALS</p><h1>Local evaluation runner</h1><p class="sub">Development-only tool. It sends sanitized benchmark rows to the installed local model and keeps the results on this device.</p></div></header>
  <section class="panel"><button id="prepare" class="link-button" type="button">Prepare local AI</button><button id="run" class="link-button" type="button" disabled>Run benchmark</button><button id="copy" class="link-button" type="button" disabled>Copy predictions JSON</button><p id="status" class="hint" role="status">Loading benchmark…</p><progress id="progress" max="1" value="0" hidden></progress></section>
  <section class="panel"><label for="output">Predictions</label><textarea id="output" rows="18" style="width:100%;font:12px ui-monospace,monospace" readonly></textarea></section>
</main><script src="eval-runner.js"></script></body></html>
